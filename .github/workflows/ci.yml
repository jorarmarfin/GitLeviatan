name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Los avisos de seguridad nuevos aparecen sin cambios en el código: auditoría semanal.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      # Que falle una plataforma no oculta el resultado de las otras.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Formato frontend
        run: pnpm format:check

      - name: Tests frontend
        run: pnpm test

      - name: Formato Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Pruebas de integración contra Git real en cada SO. Incluye la prueba de umbrales de
      # rendimiento (tests/perf/thresholds.json).
      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Los runners de Windows y macOS son más lentos y caros: el build completo solo corre allí
      # en `main` y en tags; en Ubuntu corre siempre.
      - name: Build (sin paquetes)
        if: runner.os == 'Linux' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: pnpm tauri build --no-bundle

  # Auditoría de dependencias (SPEC 08): falla ante vulnerabilidades altas o críticas y ante
  # licencias incompatibles con GPL-3.0-or-later. Excepciones: docs/decisions/0003-auditoria-dependencias.md
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit (alta o crítica)
        run: pnpm audit:js

      - name: Licencias de npm
        run: pnpm licenses:check

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: cargo deny (licencias, fuentes y avisos)
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  # E2E con tauri-driver en un job aparte: es la pieza menos estable (ver docs/e2e.md).
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Tauri 2, WebDriver y pantalla virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev webkit2gtk-driver xvfb

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - run: pnpm install --frozen-lockfile

      - name: Build debug (sin paquetes)
        run: pnpm tauri build --debug --no-bundle

      - name: E2E abrir → stage → commit → historial
        run: xvfb-run -a pnpm e2e
