name: Release

# Un tag vX.Y.Z construye los paquetes de cada plataforma y los adjunta a una única release de GitHub:
#   Linux (Ubuntu): .deb y AppImage · Windows: instalador NSIS (.exe) · macOS: .dmg universal.
# Los paquetes de Windows y macOS NO están firmados (ver README).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: paquetes (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux
            # Ubuntu 22.04: la glibc más antigua soportada; los paquetes funcionan en versiones posteriores.
            os: ubuntu-22.04
            tauri_args: --bundles deb,appimage
            rust_targets: ""
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: windows
            os: windows-latest
            tauri_args: --bundles nsis
            rust_targets: ""
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-latest
            # Binario universal (Apple Silicon + Intel) en un único .dmg.
            tauri_args: --target universal-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: La versión de tauri.conf.json debe coincidir con el tag
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con la versión $version de tauri.conf.json" >&2
            exit 1
          fi

      - name: Dependencias del sistema (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Mismas comprobaciones que el CI: no se publica nada que no pase en esa plataforma.
      - name: Lint y tests
        run: |
          pnpm lint
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Paquetes
        run: pnpm tauri build ${{ matrix.tauri_args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: paquetes-${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    name: publicar release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: paquetes-*
          merge-multiple: true
          path: paquetes

      - name: Notas de la versión (desde CHANGELOG.md)
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md no tiene una sección ## [$version]" >&2
            exit 1
          fi
          cat >> release-notes.md <<'NOTAS'

          ### Paquetes sin firmar

          Los instaladores de Windows y macOS no están firmados ni notarizados. Windows SmartScreen y
          macOS Gatekeeper mostrarán un aviso la primera vez: consulta el README para ejecutarlos.
          NOTAS

      - name: Publicar release con todos los paquetes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd paquetes
          sha256sum * > ../SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" paquetes/* SHA256SUMS.txt \
            --title "GitLeviatán $GITHUB_REF_NAME" \
            --notes-file release-notes.md
